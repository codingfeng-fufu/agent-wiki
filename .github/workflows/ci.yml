name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Run structural health check
        run: uv run llmw health check --json

      - name: Run search benchmark
        run: uv run llmw benchmark search --provider python --top-k 5 --json

      - name: Audit source distribution
        run: uv run llmw release check --no-tests --no-benchmark --sdist --no-codex --no-strict --json
