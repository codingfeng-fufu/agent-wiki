name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run release gate
        run: uv run llmw release check --sdist --no-codex --no-strict --json

      - name: Build package
        run: uv run llmw package build --no-strict --json

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: llm-wiki-dist
          path: dist/
