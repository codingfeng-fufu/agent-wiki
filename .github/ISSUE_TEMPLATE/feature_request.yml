name: Feature request
description: Suggest an improvement to LLM Wiki or its agent workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What workflow limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change that would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any other approaches you tried or rejected.
  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Explain who benefits and what gets faster, safer, or clearer.
