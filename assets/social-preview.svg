<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">LLM Wiki social preview</title>
  <desc id="desc">Give coding agents source-backed memory they can maintain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 504 C210 438 361 576 574 512 C795 446 877 350 1280 416 L1280 640 L0 640 Z" fill="#0f766e" opacity="0.18"/>
  <path d="M0 104 C244 180 382 38 619 100 C855 162 950 248 1280 168" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.22"/>

  <g filter="url(#shadow)">
    <rect x="88" y="78" width="1104" height="484" rx="24" fill="#f8fafc"/>
  </g>

  <g transform="translate(136 128)">
    <text x="0" y="0" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="800" dominant-baseline="hanging">LLM Wiki</text>
    <rect x="0" y="104" width="278" height="8" fill="url(#accent)" rx="4"/>

    <text x="0" y="158" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="700">
      <tspan x="0" dy="0">Give coding agents source-backed</tspan>
      <tspan x="0" dy="58">memory they can maintain.</tspan>
    </text>

    <text x="0" y="310" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="500">Local-first Markdown wiki | MCP tools | safe planned writes</text>

    <g transform="translate(0 374)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">
      <rect x="0" y="0" width="238" height="62" rx="12" fill="#e0f2fe"/>
      <text x="28" y="39" fill="#075985">raw evidence</text>
      <path d="M264 31 L332 31" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <path d="M320 19 L334 31 L320 43" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="358" y="0" width="296" height="62" rx="12" fill="#ccfbf1"/>
      <text x="386" y="39" fill="#115e59">maintained wiki</text>
      <path d="M680 31 L748 31" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <path d="M736 19 L750 31 L736 43" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="774" y="0" width="248" height="62" rx="12" fill="#fef3c7"/>
      <text x="802" y="39" fill="#92400e">agent MCP</text>
